[package]
name = "fabrica"
version = "0.1.0"
edition = "2024"

[dependencies]
crossterm = { version = "0.29.0", features = ["event-stream"] }
eventsource-stream = "0.2.3"
futures = "0.3.31"
langrust = "0.1.0"
ratatui = { version = "0.30.0", features = ["unstable-rendered-line-info"] }
reqwest = "0.12.28"
schemars = "1.2.0"
serde = "1.0.228"
serde_json = "1.0.145"
tempfile = "3.23.0"
tokio = { version = "^1.48.0", features = ["full"] }
tokio-stream = "0.1.18"
